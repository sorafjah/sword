<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>閃光刀 ローポリセイバーズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#07060f; --panel:#161428; --panel2:#221d3d;
  --gold:#ffd24a; --red:#ff4d5e; --blue:#4da6ff; --green:#4ddc8a;
  --hp:#ffe14d; --hp-back:#b8262f;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--ink);
  font-family:'BIZ UDPGothic',sans-serif;color:#fff;touch-action:none;overscroll-behavior:none;}
#c3d{position:fixed;inset:0;display:block;}
.overlay{position:fixed;inset:0;z-index:10;}
.hidden{display:none !important;}

/* ===== キャラクターセレクト ===== */
#select{background:radial-gradient(ellipse at 50% 30%,#20193a 0%,#0c0a1a 70%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;z-index:30;
  touch-action:pan-y;overflow:auto;}
#select h1{font-size:clamp(24px,5vw,42px);letter-spacing:.08em;color:var(--gold);
  text-shadow:0 3px 0 #7a5a00,0 6px 18px rgba(0,0,0,.6);}
#select .sub{font-size:clamp(12px,2vw,16px);color:#b9b3d9;margin-top:-6px;}
#charGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;width:min(860px,96vw);}
.card{background:var(--panel);border:3px solid #3d3766;border-radius:16px;padding:12px 10px;
  text-align:center;cursor:pointer;transition:transform .12s,border-color .12s;min-height:44px;touch-action:manipulation;}
.card:active{transform:scale(.96);}
.card.sel{border-color:var(--gold);box-shadow:0 0 18px rgba(255,210,74,.45);transform:translateY(-4px);}
.card .face{width:76px;height:76px;border-radius:50%;margin:0 auto 8px;display:flex;
  align-items:center;justify-content:center;font-size:34px;font-weight:700;position:relative;
  box-shadow:inset 0 -8px 0 rgba(0,0,0,.25),0 4px 10px rgba(0,0,0,.4);}
.card .blade{position:absolute;right:-6px;top:-10px;width:6px;height:64px;border-radius:3px;transform:rotate(28deg);
  filter:blur(.3px);}
.card .nm{font-size:18px;font-weight:700;}
.card .tp{font-size:11px;color:var(--gold);margin:2px 0 6px;}
.card .st{display:flex;flex-direction:column;gap:3px;font-size:10px;color:#c8c2e8;text-align:left;}
.stbar{height:6px;background:#0e0c1c;border-radius:3px;overflow:hidden;}
.stbar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#4da6ff,#4ddc8a);}
.card .ds{font-size:10px;color:#9c95c4;margin-top:6px;min-height:26px;}
.card .spn{font-size:11px;color:#ff9d6a;margin-top:2px;font-weight:700;}
#btnStart{margin-top:4px;font-family:inherit;font-size:20px;font-weight:700;padding:14px 56px;
  border:none;border-radius:999px;background:linear-gradient(180deg,#ffdf6a,#f5a623);color:#4a2f00;
  box-shadow:0 5px 0 #a86e00,0 8px 20px rgba(0,0,0,.5);cursor:pointer;min-height:52px;touch-action:manipulation;}
#btnStart:disabled{opacity:.4;box-shadow:none;}
#btnStart:active{transform:translateY(3px);box-shadow:0 2px 0 #a86e00;}
#howto{font-size:11px;color:#8f88bd;text-align:center;line-height:1.7;max-width:640px;}
#howto b{color:#ffd24a;}

/* ===== HUD ===== */
#hud{pointer-events:none;z-index:15;}
.hpwrap{position:absolute;top:calc(10px + env(safe-area-inset-top));width:42%;}
.hpwrap.p1{left:3%;} .hpwrap.p2{right:3%;}
.hpname{font-size:clamp(12px,2vw,16px);font-weight:700;text-shadow:0 2px 3px #000;margin-bottom:3px;}
.hpwrap.p2 .hpname{text-align:right;}
.hpbar{height:clamp(14px,2.6vh,20px);background:#20101a;border:2px solid #000;border-radius:4px;
  overflow:hidden;position:relative;box-shadow:0 2px 6px rgba(0,0,0,.5);}
.hpred{position:absolute;inset:0;background:var(--hp-back);transition:width .5s ease .25s;}
.hpfill{position:absolute;inset:0;background:linear-gradient(180deg,#fff28f,var(--hp) 45%,#e0a500);}
.hpwrap.p2 .hpred,.hpwrap.p2 .hpfill{left:auto;right:0;}
.spcd{margin-top:4px;height:7px;background:#0e0c1c;border-radius:4px;overflow:hidden;border:1px solid #000;}
.spcd i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#7a5cff,#ff5cd0);border-radius:4px;}
.spcd.rdy i{width:100%!important;background:linear-gradient(90deg,#4ddc8a,#c9ff5c);box-shadow:0 0 8px #4ddc8a;}
.splab{font-size:10px;color:#cfc9f2;margin-top:2px;text-shadow:0 1px 2px #000;}
.hpwrap.p2 .splab{text-align:right;}
#timer{position:absolute;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  font-size:clamp(24px,4.5vw,38px);font-weight:700;color:#fff;text-shadow:0 0 10px #7a5cff,0 3px 0 #000;}
.pips{position:absolute;top:calc(46px + env(safe-area-inset-top));display:flex;gap:5px;}
.pips.p1{left:3%;} .pips.p2{right:3%;}
.pip{width:14px;height:14px;border-radius:50%;background:#221d3d;border:2px solid #000;}
.pip.won{background:var(--gold);box-shadow:0 0 8px var(--gold);}
#comboL,#comboR{position:absolute;top:26%;font-size:clamp(18px,3.4vw,30px);font-weight:700;
  color:#ffdf6a;text-shadow:0 0 12px #ff7a2a,0 3px 0 #000;opacity:0;transition:opacity .2s;}
#comboL{left:5%;} #comboR{right:5%;}

/* ===== アナウンス ===== */
#announce{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  pointer-events:none;z-index:20;}
#announce span{font-size:clamp(44px,10vw,96px);font-weight:700;letter-spacing:.1em;
  color:var(--gold);text-shadow:0 0 24px rgba(255,120,40,.8),0 5px 0 #5a3a00,0 10px 30px #000;
  opacity:0;transform:scale(1.6);}
#announce span.show{animation:ann .5s forwards;}
@keyframes ann{to{opacity:1;transform:scale(1);}}

/* ===== リザルト ===== */
#result{background:rgba(6,5,14,.82);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:20px;z-index:40;backdrop-filter:blur(3px);}
#resTitle{font-size:clamp(44px,9vw,88px);font-weight:700;letter-spacing:.12em;
  text-shadow:0 0 30px currentColor,0 6px 0 #000;}
#resTitle.win{color:var(--gold);} #resTitle.lose{color:#8f9dff;}
#resSub{font-size:clamp(14px,2.4vw,20px);color:#c8c2e8;text-align:center;padding:0 12px;}
#result .btns{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;}
#result button{font-family:inherit;font-size:17px;font-weight:700;padding:14px 30px;min-height:52px;
  border:none;border-radius:999px;cursor:pointer;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.5);touch-action:manipulation;}
#result button:active{transform:translateY(3px);box-shadow:none;}
#btnRematch{background:linear-gradient(180deg,#ff7a5e,#e0402a);}
#btnSelect{background:linear-gradient(180deg,#6a8dff,#3b57d6);}

/* ===== タッチ操作 ===== */
#ctrl{z-index:18;pointer-events:none;}
#stickZone{position:absolute;left:0;bottom:0;width:46%;height:62%;pointer-events:auto;touch-action:none;}
#stickBase{position:absolute;width:132px;height:132px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.08),rgba(255,255,255,.03) 70%);
  border:2px solid rgba(255,255,255,.25);left:34px;bottom:calc(34px + env(safe-area-inset-bottom));}
#stickKnob{position:absolute;width:58px;height:58px;border-radius:50%;left:37px;top:37px;
  background:radial-gradient(circle at 35% 30%,#8f88c4,#4a4478);border:2px solid rgba(255,255,255,.5);
  box-shadow:0 4px 10px rgba(0,0,0,.5);}
#btns{position:absolute;right:calc(14px + env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));
  width:230px;height:230px;pointer-events:auto;}
.abtn{position:absolute;border-radius:50%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-weight:700;color:#fff;touch-action:none;
  border:3px solid rgba(255,255,255,.4);box-shadow:0 4px 0 rgba(0,0,0,.5),inset 0 -6px 0 rgba(0,0,0,.25);
  text-shadow:0 2px 2px rgba(0,0,0,.5);}
.abtn small{font-size:9px;font-weight:400;opacity:.9;}
.abtn.on{transform:scale(.92);box-shadow:0 1px 0 rgba(0,0,0,.5),inset 0 -3px 0 rgba(0,0,0,.25);filter:brightness(1.35);}
/* 剣(大):ためて はなつ */
#bS{width:104px;height:104px;font-size:22px;right:18px;bottom:20px;
  background:radial-gradient(circle at 35% 30%,#eaf2ff,#7f9dff);}
#bS.charge{filter:brightness(1.5);box-shadow:0 0 24px #9db4ff,0 4px 0 rgba(0,0,0,.5),inset 0 -6px 0 rgba(0,0,0,.25);}
#bS.ready{box-shadow:0 0 34px #b6ffcf,0 0 12px #fff,0 4px 0 rgba(0,0,0,.5);}
#bG{width:78px;height:78px;font-size:16px;right:132px;bottom:26px;
  background:radial-gradient(circle at 35% 30%,#8fe8a8,#1da65a);}
#bJ{width:78px;height:78px;font-size:16px;right:60px;bottom:118px;
  background:radial-gradient(circle at 35% 30%,#ffe58f,#d6a51d);}
#cmdHint{position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(10px + env(safe-area-inset-bottom));font-size:11px;color:rgba(255,255,255,.55);
  text-shadow:0 1px 2px #000;pointer-events:none;text-align:center;}
@media (max-width:700px){
  #btns{width:210px;height:210px;}
  #bS{width:94px;height:94px;right:14px;bottom:16px;}
  #bG{right:116px;bottom:22px;} #bJ{right:52px;bottom:104px;}
}
</style>
</head>
<body>
<canvas id="c3d"></canvas>

<!-- キャラクターセレクト -->
<div id="select" class="overlay">
  <h1>閃光刀 ローポリセイバーズ</h1>
  <div class="sub">― 光る刀を えらんで CPU に いどめ ―</div>
  <div id="charGrid"></div>
  <button id="btnStart" disabled>この 刀で 出撃!</button>
  <div id="howto">
    <b>移動:</b> 左スティック 左右=前進/後退 ・ 上下=まわり込み(サイドステップ)<br>
    <b>剣ボタン:</b> ポンと押す=通常斬り / <b>押し続けて はなす</b>=溜め必殺斬り!(0.6秒ほど溜めると 刀が強く光る)<br>
    <b>ガード:</b> 相手の斬撃を ふせぐ ・ <b>ジャンプ:</b> 飛んで かわす<br>
    <span style="color:#6f689a">キーボード: 矢印=移動 / Z=剣(長押しで必殺) / C=ガード / Space=ジャンプ</span>
  </div>
</div>

<!-- HUD -->
<div id="hud" class="overlay hidden">
  <div class="hpwrap p1">
    <div class="hpname" id="name1">P1</div>
    <div class="hpbar"><div class="hpred" id="hpr1"></div><div class="hpfill" id="hp1"></div></div>
    <div class="spcd" id="cd1w"><i id="cd1"></i></div>
    <div class="splab" id="sp1">必殺</div>
  </div>
  <div class="hpwrap p2">
    <div class="hpname" id="name2">CPU</div>
    <div class="hpbar"><div class="hpred" id="hpr2"></div><div class="hpfill" id="hp2"></div></div>
    <div class="spcd" id="cd2w"><i id="cd2"></i></div>
    <div class="splab" id="sp2">必殺</div>
  </div>
  <div id="timer">60</div>
  <div class="pips p1" id="pips1"><div class="pip"></div><div class="pip"></div></div>
  <div class="pips p2" id="pips2"><div class="pip"></div><div class="pip"></div></div>
  <div id="comboL"></div><div id="comboR"></div>
</div>

<div id="announce"><span id="annText"></span></div>

<!-- リザルト -->
<div id="result" class="overlay hidden">
  <div id="resTitle">YOU WIN</div>
  <div id="resSub"></div>
  <div class="btns">
    <button id="btnRematch">もう一度 たたかう</button>
    <button id="btnSelect">刀を えらび直す</button>
  </div>
</div>

<!-- タッチ操作 -->
<div id="ctrl" class="overlay hidden">
  <div id="stickZone"><div id="stickBase"><div id="stickKnob"></div></div></div>
  <div id="btns">
    <div class="abtn" id="bS">剣<small>ためて必殺</small></div>
    <div class="abtn" id="bG">G<small>ガード</small></div>
    <div class="abtn" id="bJ">JP<small>ジャンプ</small></div>
  </div>
  <div id="cmdHint">剣ボタンを 長押し→はなす で 必殺斬り!</div>
</div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "cannon-es":"https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
}}
</script>
<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

/* ============================================================
   0. 定数・キャラクターデータ
============================================================ */
const STAGE_X = 8.6;          // ステージ端(これ以上は追い込まれる)
const STAGE_Z = 3.6;          // 奥行き(まわり込み用に少し広め)
const ROUNDS_TO_WIN = 2;
const ROUND_TIME = 60;

// 必殺の溜め判定(ゆるめ)
const CHARGE_READY = 0.60;    // ここまで溜めると「溜め完了」演出&最大発光
const CHARGE_MIN   = 0.42;    // これ以上溜めて離せば必殺(多少前後してもOK)

const CHARS = [
  { id:'gou', name:'ゴウ', type:'パワー型', emoji:'剛',
    color:0xd6452f, sub:0x7c1f14, skin:0xf0b98c,
    scale:1.2, width:1.35, speed:3.2, hp:118, reach:1.9, jumpV:9.2,
    saber:0xff5a3c, saberGlow:0xffb066,
    light:{dmg:8}, heavy:{dmg:15, kb:4.6},
    sp:{name:'紅蓮斬り'},
    stats:{pow:.95, spd:.35, rch:.9},
    desc:'重い一撃と長いリーチ。ただし足はおそい' },
  { id:'hayate', name:'ハヤテ', type:'スピード型', emoji:'疾',
    color:0x2fc98f, sub:0x14705a, skin:0xf5c9a0,
    scale:0.98, width:1.0, speed:5.6, hp:88, reach:1.5, jumpV:10.5,
    saber:0x7dffd6, saberGlow:0xd0fff0,
    light:{dmg:4}, heavy:{dmg:8, kb:3.2},
    sp:{name:'疾風一閃'},
    stats:{pow:.35, spd:.98, rch:.4},
    desc:'最速の身のこなし。手数で押しきれ' },
  { id:'mio', name:'ミオ', type:'バランス型', emoji:'澪',
    color:0x4d7dff, sub:0x22398c, skin:0xf7d2ae,
    scale:1.06, width:1.1, speed:4.3, hp:100, reach:1.65, jumpV:9.8,
    saber:0x5cb8ff, saberGlow:0xbfe6ff,
    light:{dmg:6}, heavy:{dmg:12, kb:3.8},
    sp:{name:'蒼波斬'},
    stats:{pow:.6, spd:.6, rch:.6},
    desc:'クセのない万能タイプ。基本を学ぶならこの人' },
  { id:'volt', name:'ボルト', type:'トリッキー型', emoji:'雷',
    color:0xe8c92e, sub:0x8c7314, skin:0xe6b088,
    scale:1.02, width:1.05, speed:4.6, hp:94, reach:1.55, jumpV:10.2,
    saber:0xffee55, saberGlow:0xfffbc0,
    light:{dmg:5}, heavy:{dmg:11, kb:3.6},
    sp:{name:'雷光刃'},
    stats:{pow:.55, spd:.7, rch:.55},
    desc:'素早い斬撃で相手をゆさぶる万能剣士' },
];
// 通常斬り・必殺のパラメータを派生生成
CHARS.forEach(c=>{
  c.slash  ={dmg:c.heavy.dmg, startup:.15, active:.16, rec:.30, kb:c.heavy.kb};
  c.special={name:c.sp.name, dmg:Math.round(c.heavy.dmg*1.7)+6,
             startup:.30, active:.20, rec:.42, kb:c.heavy.kb*1.7+2, chip:7};
});

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);

/* ============================================================
   1. サウンドエンジン(Web Audio API)
============================================================ */
const AudioEngine = {
  ctx:null, master:null, bgmGain:null, bgmTimer:null, bgmStep:0,
  init(){
    if(this.ctx) return;
    this.ctx = new (window.AudioContext||window.webkitAudioContext)();
    this.master = this.ctx.createGain(); this.master.gain.value=.6;
    this.master.connect(this.ctx.destination);
    this.bgmGain = this.ctx.createGain(); this.bgmGain.gain.value=.26;
    this.bgmGain.connect(this.master);
  },
  resume(){ if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); },
  tone(freq,dur,type='square',vol=.3,slide=0,when=0){
    if(!this.ctx) return;
    const t=this.ctx.currentTime+when;
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),t+dur);
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t+dur+.02);
  },
  noise(dur,vol=.3,filterFreq=2000,type='lowpass',when=0){
    if(!this.ctx) return;
    const t=this.ctx.currentTime+when;
    const len=Math.max(1,Math.floor(this.ctx.sampleRate*dur));
    const buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    const src=this.ctx.createBufferSource(); src.buffer=buf;
    const f=this.ctx.createBiquadFilter(); f.type=type; f.frequency.value=filterFreq;
    const g=this.ctx.createGain(); g.gain.value=vol;
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t);
  },
  // 効果音プリセット(刀ベース)
  sSwing(){ this.noise(.10,.28,4200,'highpass'); this.tone(680,.09,'square',.10,-260); },
  sHit(big){ if(big){ this.noise(.18,.5,1500); this.tone(120,.16,'sawtooth',.35,-70);}
             else { this.noise(.09,.32,2600); this.tone(200,.07,'square',.2,-90);} },
  sGuard(){ this.tone(1200,.05,'square',.16,-200); this.noise(.10,.26,5200,'highpass');
            this.tone(760,.05,'square',.14,-140); },
  sJump(){ this.tone(220,.14,'square',.18,260); },
  sChargeTick(n){ this.tone(300+n*70,.05,'square',.10,120); },
  sReady(){ this.tone(880,.10,'square',.22,300); this.tone(1320,.12,'square',.14,0,.05); },
  sSpecial(){ this.tone(160,.35,'sawtooth',.32,-120); this.noise(.34,.42,2200);
              this.tone(520,.28,'square',.16,-360,.02); },
  sCount(){ this.tone(440,.12,'square',.3); },
  sGo(){ this.tone(880,.35,'square',.35); this.tone(1320,.3,'square',.2,0,.05); },
  sKO(){ this.tone(500,.5,'sawtooth',.4,-420); this.noise(.5,.4,700,'lowpass',.05); },
  sWin(){ [523,659,784,1047].forEach((f,i)=>this.tone(f,.22,'square',.28,0,i*.13)); },
  sLose(){ [392,330,262,196].forEach((f,i)=>this.tone(f,.26,'triangle',.26,0,i*.16)); },
  sSelect(){ this.tone(700,.08,'square',.25,200); },
  startBGM(){
    if(!this.ctx||this.bgmTimer) return;
    const bass=[110,110,131,110, 98,98,131,147, 110,110,131,110, 165,147,131,98];
    const arp =[440,554,659,554];
    const stepDur=60/152/2;
    let next=this.ctx.currentTime+.05;
    this.bgmTimer=setInterval(()=>{
      while(next<this.ctx.currentTime+.25){
        const s=this.bgmStep;
        const b=bass[s%16];
        this._bgmTone(b,stepDur*.9,'triangle',.5,next);
        if(s%2===0) this._bgmTone(arp[(s/2|0)%4]*(s%8<4?1:1.122),stepDur*.55,'square',.14,next);
        if(s%4===2) this._bgmNoiseHat(next);
        next+=stepDur; this.bgmStep++;
      }
    },60);
  },
  _bgmTone(f,d,type,v,t){
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g);g.connect(this.bgmGain);o.start(t);o.stop(t+d+.02);
  },
  _bgmNoiseHat(t){
    const len=Math.floor(this.ctx.sampleRate*.04),buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate);
    const d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
    const src=this.ctx.createBufferSource();src.buffer=buf;
    const f=this.ctx.createBiquadFilter();f.type='highpass';f.frequency.value=6000;
    const g=this.ctx.createGain();g.gain.value=.12;
    src.connect(f);f.connect(g);g.connect(this.bgmGain);src.start(t);
  },
  stopBGM(){ if(this.bgmTimer){clearInterval(this.bgmTimer);this.bgmTimer=null;} },
};

function newInput(){return{moveX:0,sideZ:0,swordHeld:false,jump:false,guard:false};}

const Pad={
  stick:{x:0,y:0}, btn:{S:false,G:false,J:false}, prevJ:false, keys:{},
  read(face){
    const inp=newInput();
    let kx=0, kz=0;
    if(this.keys['ArrowLeft']||this.keys['a'])kx-=1;
    if(this.keys['ArrowRight']||this.keys['d'])kx+=1;
    if(this.keys['ArrowUp']||this.keys['w'])kz-=1;
    if(this.keys['ArrowDown']||this.keys['s'])kz+=1;
    const sx=this.stick.x, sy=this.stick.y;
    if(Math.abs(sx)>.3)kx=Math.sign(sx);
    if(Math.abs(sy)>.3)kz=clamp(sy/.75,-1,1);   // 上=マイナスZ / 下=プラスZ(両方向まわり込み)
    inp.moveX=kx*face;                           // 相手方向を+に変換
    inp.sideZ=kz;
    const S=this.btn.S||this.keys['z']||this.keys['x'];
    const G=this.btn.G||this.keys['c'];
    const J=this.btn.J||this.keys[' '];
    inp.swordHeld=!!S;
    inp.guard=!!G;
    if(J&&!this.prevJ)inp.jump=true;
    this.prevJ=!!J;
    return inp;
  }
};

const particles=[];
function spawnBurst(pos,color,n=14,speed=5,size=.14,life=.5){
  for(let i=0;i<n;i++){
    const m=new THREE.Mesh(new THREE.SphereGeometry(size*rand(.6,1.3),5,5),
      new THREE.MeshBasicMaterial({color,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
    m.position.copy(pos);
    const th=rand(0,Math.PI*2);
    particles.push({m,life,max:life,
      v:new THREE.Vector3(Math.cos(th)*speed*rand(.3,1),rand(1,speed),Math.sin(th)*speed*rand(.3,1)*.5)});
    scene.add(m);
  }
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.life-=dt; p.v.y-=14*dt;
    p.m.position.addScaledVector(p.v,dt);
    p.m.material.opacity=p.life/p.max;
    p.m.scale.setScalar(Math.max(.01,p.life/p.max));
    if(p.life<=0){scene.remove(p.m);p.m.geometry.dispose();p.m.material.dispose();particles.splice(i,1);}
  }
}

// 三日月状の斬撃フラッシュ
const slashes=[];
function spawnSlashArc(f,big){
  const col=f.def.saber;

  const geo=new THREE.RingGeometry(r0,r1,26,1,Math.PI*0.12,Math.PI*0.95);

    side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false});
  const arc=new THREE.Mesh(geo,mat);
  const dir=f.face;
  arc.position.set(f.mesh.position.x+dir*0.85, f.mesh.position.y+1.2*f.def.scale, f.mesh.position.z+0.15);
  arc.rotation.z = -dir*Math.PI*0.55;
  arc.scale.set(dir,1,1);
  scene.add(arc);
  slashes.push({m:arc,life:big?.30:.20,max:big?.30:.20,grow:big?2.4:1.8,spin:-dir*3});
  // 白い芯のフラッシュ
  spawnBurst(arc.position, 0xffffff, big?10:5, big?5:3, .12, .28);
}
function updateSlashes(dt){
  for(let i=slashes.length-1;i>=0;i--){
    const s=slashes[i]; s.life-=dt;
    s.m.material.opacity=(s.life/s.max)*.85;
    const g=1+s.grow*dt;
    s.m.scale.x*=g*Math.sign(s.m.scale.x); s.m.scale.y*=g;
    s.m.rotation.z+=s.spin*dt;
    if(s.life<=0){scene.remove(s.m);s.m.geometry.dispose();s.m.material.dispose();slashes.splice(i,1);}
  }
}

/* ============================================================
   6. Fighter クラス(刀持ち)
============================================================ */
class Fighter{
  constructor(def,isPlayer){
    this.def=def; this.isPlayer=isPlayer;
    this._upperRX=0;
    this.buildMesh();
    const s=def.scale;
    this.body=new CANNON.Body({
      mass:70,
      shape:new CANNON.Box(new CANNON.Vec3(def.width*.32,s*.88,.35)),
      position:new CANNON.Vec3(0,s*.88,0),
      fixedRotation:true,
      linearDamping:.02,
    });
    this.body.updateMassProperties();
    world.addBody(this.body);
    this.reset(0);
  }
  buildMesh(){
    const d=this.def, s=d.scale;
    const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.65});
    const M=(geo,m)=>{const o=new THREE.Mesh(geo,m);o.castShadow=true;return o;};
    this.mesh=new THREE.Group();
    this.bodyG=new THREE.Group(); this.mesh.add(this.bodyG);
    // ★上半身グループ(胴・頭・腕)。しゃがみ/ダウン等はこのグループだけを動かし
    //   脚(bodyG直下)を地面に残すことで「めり込み」を防ぐ
    this.upper=new THREE.Group(); this.bodyG.add(this.upper);

    // 胴体
    this.torso=M(new THREE.BoxGeometry(.62*d.width,.7,.42),mat(d.color));
    this.torso.position.y=1.05*s; this.upper.add(this.torso);
    const belt=M(new THREE.BoxGeometry(.64*d.width,.14,.44),mat(0x222222));
    belt.position.y=-.32; this.torso.add(belt);
    // 頭
    this.head=M(new THREE.BoxGeometry(.42,.42,.4),mat(d.skin));
    this.head.position.y=1.62*s; this.upper.add(this.head);
    const hair=M(new THREE.BoxGeometry(.46,.18,.44),mat(d.sub));
    hair.position.y=.22; this.head.add(hair);
    const eyeM=new THREE.MeshBasicMaterial({color:0x111111});
    [-.1,.1].forEach(x=>{const e=new THREE.Mesh(new THREE.BoxGeometry(.06,.09,.02),eyeM);
      e.position.set(x,.02,.21);this.head.add(e);});
    // 腕(肩ピボット)
    this.armL=new THREE.Group(); this.armR=new THREE.Group();
    [[this.armL,-1],[this.armR,1]].forEach(([g,sd])=>{
      g.position.set(sd*.42*d.width,1.32*s,0);
      const upper=M(new THREE.BoxGeometry(.17,.5,.17),mat(d.color));
      upper.position.y=-.22; g.add(upper);
      const fist=M(new THREE.BoxGeometry(.2,.2,.2),mat(d.skin));
      fist.position.y=-.52; g.add(fist);
      this.upper.add(g);
    });
    // ★刀(ライトセーバー風)を右手に装着 — 腕と一緒に振れる
    this.buildSword(d,s);
    // 脚(腰ピボット。bodyG直下=上半身の上下動と独立)
    this.legL=new THREE.Group(); this.legR=new THREE.Group();
    [[this.legL,-1],[this.legR,1]].forEach(([g,sd])=>{
      g.position.set(sd*.17*d.width,.72*s,0);
      const leg=M(new THREE.BoxGeometry(.2,.62,.2),mat(d.sub));
      leg.position.y=-.3; g.add(leg);
      const foot=M(new THREE.BoxGeometry(.22,.14,.32),mat(0x222222));
      foot.position.set(0,-.62,.05); g.add(foot);
      this.bodyG.add(g);
    });
    // 影の輪
    const ring=new THREE.Mesh(new THREE.RingGeometry(.3,.55,20),
      new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.35}));
    ring.rotation.x=-Math.PI/2; ring.position.y=.02; this.mesh.add(ring);
    this.shadowRing=ring;
    scene.add(this.mesh);
  }
  buildSword(d,s){
    const sCol=d.saber, sGlow=d.saberGlow;
    const bladeLen=1.05*s;   // 長すぎると構え・ダウン時に床へ刺さるため短めに
    this.bladeLen=bladeLen; this.bladeExt=1;
    this.sword=new THREE.Group();
    this.sword.position.set(0,-0.58,0.06);   // 右手のこぶし付近。刃は-Y方向(腕の延長)へ
    this.armR.add(this.sword);
    // 柄(つか)
    const hilt=new THREE.Mesh(new THREE.CylinderGeometry(.055,.062,.28,10),
      new THREE.MeshStandardMaterial({color:0x24242c,metalness:.7,roughness:.35}));
    hilt.position.y=-.02; this.sword.add(hilt);
    const guardPc=new THREE.Mesh(new THREE.BoxGeometry(.26,.05,.1),
      new THREE.MeshStandardMaterial({color:0x3a3a44,metalness:.7,roughness:.35}));
    guardPc.position.y=-.16; this.sword.add(guardPc);
    const bladeY=-0.16-bladeLen/2;
    // 芯(白):MeshBasicで常時発光
    this.bladeCore=new THREE.Mesh(new THREE.CylinderGeometry(.036,.028,bladeLen,10),
      new THREE.MeshBasicMaterial({color:0xffffff}));
    this.bladeCore.position.y=bladeY; this.sword.add(this.bladeCore);
    // 内側グロー(キャラ色・加算)
    this.bladeGlow=new THREE.Mesh(new THREE.CylinderGeometry(.10,.08,bladeLen,14),
      new THREE.MeshBasicMaterial({color:sCol,transparent:true,opacity:.5,
        blending:THREE.AdditiveBlending,depthWrite:false}));
    this.bladeGlow.position.y=bladeY; this.sword.add(this.bladeGlow);
    // 外側グロー(淡いキャラ色・加算)
    this.bladeGlow2=new THREE.Mesh(new THREE.CylinderGeometry(.19,.14,bladeLen*.98,14),
      new THREE.MeshBasicMaterial({color:sGlow,transparent:true,opacity:.2,
        blending:THREE.AdditiveBlending,depthWrite:false}));
    this.bladeGlow2.position.y=bladeY; this.sword.add(this.bladeGlow2);
    // 刃先の丸い光
    this.bladeTip=new THREE.Mesh(new THREE.SphereGeometry(.09,10,10),
      new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.9,
        blending:THREE.AdditiveBlending,depthWrite:false}));
    this.bladeTip.position.y=bladeY-bladeLen/2; this.sword.add(this.bladeTip);
    // 刃先のPointLight(控えめに周囲を照らす)
    this.tipLight=new THREE.PointLight(sCol,1.1,4.2,2);
    this.tipLight.position.y=bladeY-bladeLen*0.35; this.sword.add(this.tipLight);
    this._glowBase={g1:.5,g2:.2,tip:1.1};
  }
  reset(x){
    this.hp=this.def.hp; this.maxHp=this.def.hp;
    this.state='idle'; this.stateT=0;
    this.dead=false; this.grounded=true;
    this.attack=null; this.hitDone=false; this._arcDone=false;
    this.charging=false; this.chargeT=0; this._readyPinged=false; this._lastTick=0;
    this.bladeExt=1; this._prevSword=false;
    this.saberBoost=1; this.comboOn=0; this.hitstun=0;
    this.body.position.set(x,this.def.scale*.88,0);
    this.body.velocity.set(0,0,0);
    this.mesh.rotation.set(0,0,0);
    this.bodyG.rotation.set(0,0,0);
    this.upper.position.set(0,0,0); this.upper.rotation.set(0,0,0);
    this._upperRX=0;
    // 四肢もidle姿勢へ即スナップ(KO姿勢のまま刀身だけ復活すると床を貫くため)
    this.armL.rotation.set(-.25,0,0); this.armR.rotation.set(.95,0,0);
    this.legL.rotation.set(0,0,0); this.legR.rotation.set(0,0,0);
    this.face=1;
  }
  guarding(){ return this.state==='guard'||this.state==='blockstun'; }
  busy(){ return ['slash','special','hitstun','blockstun','down','ko','win'].includes(this.state); }
  setState(s){ this.state=s; this.stateT=0; this.hitDone=false; this._arcDone=false; }

  startSlash(){
    this.attack={...this.def.slash};
    this.setState('slash');
    AudioEngine.sSwing();
  }
  startSpecial(){
    this.attack={...this.def.special};
    this.setState('special');
    this.saberBoost=2.6;
    spawnBurst(new THREE.Vector3(this.mesh.position.x,this.mesh.position.y+1.2*this.def.scale,this.mesh.position.z),
      this.def.saber,10,3,.16,.4);
    AudioEngine.sSwing();
  }
  takeHit(dmg,kb,big=false){
    if(this.dead)return;
    this.hp=Math.max(0,this.hp-dmg);
    this.charging=false; this.chargeT=0; this.attack=null; this.saberBoost=1;
    this.body.velocity.x=kb; this.body.velocity.z*=0.2;
    spawnBurst(new THREE.Vector3(this.mesh.position.x,this.mesh.position.y+1.1*this.def.scale,this.mesh.position.z),
      0xffdd66,big?16:9,big?6:4,.14,.45);
    if(this.hp<=0){
      this.dead=true; this.setState('ko');
      this.body.velocity.set(kb*1.5,5,0);
      return;
    }
    if(big){ this.setState('down'); this.body.velocity.y=4.6; }
    else { this.setState('hitstun'); this.hitstun=dmg>=10?.5:.34; }
  }
  takeBlock(chip,kb){
    if(chip)this.hp=Math.max(1,this.hp-chip);
    this.charging=false; this.chargeT=0;
    this.body.velocity.x=kb;
    this.setState('blockstun');
    AudioEngine.sGuard();
    spawnBurst(new THREE.Vector3(this.mesh.position.x+this.face*.6,
      this.mesh.position.y+1.15*this.def.scale,this.mesh.position.z),0xbfe0ff,8,3,.10,.32);
  }

  update(dt,inp){
    const d=this.def, b=this.body;
    this.stateT+=dt;
    this.saberBoost=1; // 既定。special中のみ下で上書き
    const prevSword=this._prevSword||false;
    this._prevSword=!!(inp&&inp.swordHeld);
    // 接地判定
    this.grounded=b.position.y<=d.scale*.88+.06 && Math.abs(b.velocity.y)<3;
    if(this.opponent && !this.dead){
      this.face=Math.sign(this.opponent.body.position.x-b.position.x)||this.face;
    }
    const S=this.state;

    if(S==='ko'){ b.velocity.x*=.94; return this.applyPose(dt); }
    if(S==='win'){ b.velocity.x=0; return this.applyPose(dt); }
    if(S==='down'){
      if(this.grounded&&this.stateT>.9)this.setState('idle');
      b.velocity.x*=.9; return this.applyPose(dt);
    }
    if(S==='hitstun'){
      this.hitstun-=dt; b.velocity.x*=.9;
      if(this.hitstun<=0)this.setState('idle');
      return this.applyPose(dt);
    }
    if(S==='blockstun'){
      b.velocity.x*=.85;
      if(this.stateT>.20)this.setState('guard');
      return this.applyPose(dt);
    }
    // 斬撃・必殺
    if(S==='slash'||S==='special'){
      const A=this.attack;
      const total=A.startup+A.active+A.rec;
      const active=this.stateT>=A.startup && this.stateT<A.startup+A.active;
      if(S==='special'){
        if(this.stateT<A.startup) this.saberBoost=lerp(1.8,2.8,this.stateT/A.startup);
        else this.saberBoost=lerp(2.8,1.2,clamp((this.stateT-A.startup)/(A.active+A.rec),0,1));
        if(active){ b.velocity.x=this.face*4.6; }       // 踏み込み
        else if(this.grounded) b.velocity.x*=.82;
      }else{
        if(this.grounded) b.velocity.x*=.85;
      }
      if(active && !this.hitDone) this.tryHit(A,S==='special');
      if(this.stateT>=A.startup && !this._arcDone){
        this._arcDone=true;
        spawnSlashArc(this,S==='special');
        if(S==='special'){ AudioEngine.sSpecial(); shake(.3,.36); }
      }
      if(this.stateT>=total){ this.saberBoost=1; this.setState('idle'); }
      return this.applyPose(dt);
    }

    // ===== 通常行動 =====
    if(!inp)inp=newInput();
    if(this.grounded){
      if(inp.guard){
        this.charging=false; this.chargeT=0;
        this.setStateIf('guard');
        b.velocity.x*=.8; b.velocity.z*=.8;
      }
      else if(this.charging || inp.swordHeld){
        if(inp.swordHeld){
          // 溜め継続
          if(!this.charging){ this.charging=true; this.chargeT=0; this._readyPinged=false; this._lastTick=0; }
          this.charging=true;
          this.chargeT+=dt;
          this.setStateIf('charge');
          // 溜め中はゆっくり動ける(サイドステップで位置調整可)
          const vx=inp.moveX*this.face*d.speed*.32;
          const vz=inp.sideZ*d.speed*.4;
          b.velocity.x=lerp(b.velocity.x,vx,.25);
          b.velocity.z=lerp(b.velocity.z,vz,.25);
          // 溜め演出音
          const tickStep=Math.floor(this.chargeT/0.14);
          if(tickStep>this._lastTick && this.chargeT<CHARGE_READY){ this._lastTick=tickStep; AudioEngine.sChargeTick(tickStep); }
          if(this.chargeT>=CHARGE_MIN && !this._readyPinged){ this._readyPinged=true; AudioEngine.sReady(); }
        }else{
          // 手を離した → 溜め判定
          const charged=this.chargeT>=CHARGE_MIN;
          this.charging=false; this.chargeT=0;
          if(charged) this.startSpecial();
          else this.startSlash();
        }
      }
      else if(inp.jump){
        b.velocity.y=d.jumpV;
        b.velocity.x=inp.moveX*this.face*d.speed*.9;
        b.velocity.z=inp.sideZ*d.speed*.7;
        this.setState('jump'); AudioEngine.sJump();
      }
      else{
        const vx=inp.moveX*this.face*d.speed;
        const vz=inp.sideZ*d.speed*.9;
        b.velocity.x=lerp(b.velocity.x,vx,.4);
        b.velocity.z=lerp(b.velocity.z,vz,.35);
        this.setStateIf(Math.abs(vx)>.4||Math.abs(vz)>.4?'walk':'idle');
      }
    }else{
      // 空中:剣ボタン押した瞬間に空中斬り(溜め不可・押しっぱなし連発は不可)
      if(inp.swordHeld && !prevSword && this.state==='jump'){ this.startSlash(); }
      else if(this.state!=='slash') this.setStateIf('jump');
    }
    this.applyPose(dt);
  }
  setStateIf(s){ if(this.state!==s){this.state=s;this.stateT=0;} }

  tryHit(A,big){
    const opp=this.opponent;
    if(!opp||opp.dead)return;
    if(opp.state==='down')return; // ダウン中は無敵(起き攻めループ防止)
    const dxs=opp.body.position.x-this.body.position.x;
    const adx=Math.abs(dxs);
    const dz=Math.abs(opp.body.position.z-this.body.position.z);
    const range=this.def.reach+0.75+(big?0.35:0);  // ゆるめ
    const inFront=Math.sign(dxs)===this.face || adx<0.6;
    if(!inFront || adx>range || dz>1.7) return;      // 縦のズレも寛容
    if(opp.body.position.y>opp.def.scale*.88+1.7) return; // 相手が飛び越えた
    this.hitDone=true;
    if(opp.guarding()){
      opp.takeBlock(big?A.chip:0,this.face*A.kb*.6);
      this.body.velocity.x=-this.face*1.5;
    }else{
      const wasStun=opp.state==='hitstun';
      opp.takeHit(A.dmg,this.face*A.kb,big);
      this.comboOn=wasStun?this.comboOn+1:1;
      showCombo(this,this.comboOn);
      if(big){ AudioEngine.sHit(true); shake(.28,.34); hitstop(.10); }
      else{ AudioEngine.sHit(false); shake(.14,.16); hitstop(.05); }
    }
  }

  /* ---- 手続きアニメーション ---- */
  applyPose(dt){
    const d=this.def, t=this.stateT, S=this.state, s=d.scale;
    // 目標姿勢: 腕(aL/aR/横aLy/aRy)、脚(lL/lR)、上半身の下げ(upperY)/前後傾(upperRX)
    let p={aL:.15,aR:-.15,aLy:0,aRy:0,lL:0,lR:0,upperY:0,upperRX:0};
    const bob=Math.sin(performance.now()/300)*.05;
    switch(S){
      case 'idle': p.aL=.25+bob; p.aR=-.95-bob*.5; p.upperY=bob*.03; break;
      case 'walk':{const w=Math.sin(performance.now()/90);
        p.lL=w*.7;p.lR=-w*.7;p.aL=-w*.4;p.aR=-.95-w*.12;break;}
      case 'guard': p.aL=-1.9;p.aR=-1.7;p.aLy=.5;p.aRy=-.4;p.upperRX=.1;p.lL=.25;p.lR=.25;p.upperY=-.05*s;break;
      case 'jump': p.lL=-.9;p.lR=-.6;p.aL=-.5;p.aR=-1.0;break;
      case 'charge':{ // 上段に振りかぶって溜める(刀が床を向く角度を通らない経路)
        const c=clamp(this.chargeT/CHARGE_READY,0,1);
        p.aR=-2.0-c*.3; p.aL=-1.2; p.aLy=-.3; p.upperRX=-.06-c*.05;
        p.lL=.30;p.lR=.30;p.upperY=-.08*s;
        break;}
      case 'slash':{const A=this.attack;
        // 振りかぶり→頭上を越えて前へ振り下ろす連続経路(腕が真下=床方向を通らない)
        let aR;
        if(t<A.startup) aR=lerp(-.95,-2.4,t/A.startup);              // 上段へ振りかぶり
        else if(t<A.startup+A.active) aR=lerp(-2.4,-4.9,(t-A.startup)/A.active); // 頭上を越えて前へ振り抜き
        else aR=lerp(-4.9,-.95,clamp((t-A.startup-A.active)/A.rec,0,1));
        p.aR=aR; p.aL=-.2;
        p.upperRX=-.14*Math.sin(clamp((t-A.startup)/A.active,0,1)*Math.PI);
        break;}
      case 'special':{const A=this.attack;
        // 溜め構え(-2.0付近)からさらに大きく頭上を越える一撃
        let aR;
        if(t<A.startup) aR=lerp(-2.0,-2.6,t/A.startup);
        else if(t<A.startup+A.active) aR=lerp(-2.6,-5.1,(t-A.startup)/A.active);
        else aR=lerp(-5.1,-.95,clamp((t-A.startup-A.active)/A.rec,0,1));
        p.aR=aR; p.aL=lerp(-1.2,-.5,clamp((t-A.startup)/A.active,0,1));
        p.upperRX=(t<A.startup? -.15 : .2*Math.sin(clamp((t-A.startup)/A.active,0,1)*Math.PI));
        p.lL=.15;p.lR=-.1;
        break;}
      case 'hitstun': p.upperRX=.35;p.aL=-.5;p.aR=-1.2;p.lL=-.2;break;
      case 'blockstun': p.aL=-1.9;p.aR=-1.7;p.aLy=.5;p.aRy=-.4;p.upperRX=.2;break;
      case 'down': p.upperRX=Math.min(1.25,t*4);
        p.aL=.6;p.aR=.6;p.lL=-.35;p.lR=-.15;break;
      case 'ko': p.upperRX=Math.min(1.3,t*3.2);
        p.aL=.6;p.aR=.6;p.lL=-.4;p.lR=-.2;break;
      case 'win':{const w=Math.min(1,t*3);
        p.aR=lerp(-.95,-2.5,w);p.aL=.35;p.upperY=Math.abs(Math.sin(t*6))*.09;break;}
    }
    const k=1-Math.pow(.0001,dt); // フレームレート非依存スムージング
    this.armL.rotation.x=lerp(this.armL.rotation.x,-p.aL,k);
    this.armR.rotation.x=lerp(this.armR.rotation.x,-p.aR,k);
    this.armL.rotation.z=lerp(this.armL.rotation.z,p.aLy,k);
    this.armR.rotation.z=lerp(this.armR.rotation.z,p.aRy,k);
    this.legL.rotation.x=lerp(this.legL.rotation.x,-p.lL,k);
    this.legR.rotation.x=lerp(this.legR.rotation.x,-p.lR,k);
    // ★上半身だけを上下&傾ける(脚=bodyG直下 は地面に残る)
    this.upper.position.y=lerp(this.upper.position.y,p.upperY,k);
    this._upperRX=lerp(this._upperRX,p.upperRX,k);
  }
  updateSaber(dt){
    // ダウン/KO中は刃を収納(消灯)し、床へ刺さる見た目を防ぐ
    // 消灯はすばやく、再点灯はゆっくり(腕が構えに戻ってから伸びるので安全)
    const off=(this.state==='down'||this.state==='ko');
    const kExt=1-Math.pow(off? .0000001 : .03, dt||1/60);
    this.bladeExt=lerp(this.bladeExt??1,off?0:1,kExt);
    const ext=clamp(this.bladeExt,0.02,1);
    let boost=1;
    if(this.state==='charge'){
      const c=clamp(this.chargeT/CHARGE_READY,0,1);
      boost=1+c*1.7;
      if(this.chargeT>=CHARGE_MIN) boost+=0.25+Math.sin(performance.now()/55)*0.25; // 溜め完了で脈動
    }else{
      boost=this.saberBoost||1;
    }
    boost=clamp(boost,.7,3.3)*Math.min(1,ext*1.4);
    const gb=this._glowBase, L=this.bladeLen, yC=-0.16-(L*ext)/2;
    this.bladeCore.position.y=yC; this.bladeCore.scale.y=ext;
    this.bladeGlow.position.y=yC; this.bladeGlow2.position.y=yC;
    this.bladeGlow.material.opacity=clamp(gb.g1*boost,0,1);
    this.bladeGlow2.material.opacity=clamp(gb.g2*boost,0,.95);
    const sc=1+(boost-1)*.5;
    this.bladeGlow.scale.set(sc,ext,sc);
    this.bladeGlow2.scale.set(sc,ext,sc);
    this.bladeTip.position.y=-0.16-L*ext;
    this.bladeTip.material.opacity=clamp((.8+(boost-1)*.1)*ext,0,1);
    this.tipLight.intensity=gb.tip*boost*ext;
    this.tipLight.distance=3.6+boost*1.3;
  }
  syncMesh(dt){
    const b=this.body;
    b.position.x=clamp(b.position.x,-STAGE_X,STAGE_X);
    b.position.z=clamp(b.position.z,-STAGE_Z,STAGE_Z);
    // 足元(mesh基準y=0)が接地。上半身だけを下げているのでめり込まない
    this.mesh.position.set(b.position.x,Math.max(0,b.position.y-this.def.scale*.88),b.position.z);
    if(this.opponent&&!this.dead){
      const dx=this.opponent.mesh.position.x-this.mesh.position.x;
      const dz=this.opponent.mesh.position.z-this.mesh.position.z;
      const target=Math.atan2(dx,dz);
      let cur=this.mesh.rotation.y;
      let diff=((target-cur+Math.PI)%(Math.PI*2))-Math.PI;
      this.mesh.rotation.y=cur+diff*.2;
    }
    this.upper.rotation.x=-(this._upperRX||0);
    this.shadowRing.material.opacity=this.grounded?.35:.18;
    this.shadowRing.position.y=.02-this.mesh.position.y+0.02;
    this.updateSaber(dt);
  }
}

/* ============================================================
   7. CPU AI(刀+溜め必殺対応)
============================================================ */
class CpuBrain{
  constructor(me,foe){
    this.me=me;this.foe=foe;
    this.decideT=0; this.plan={}; this.swordT=0;
    this.guardT=0; this.jumpCd=0; this.strafe=0; this.strafeT=0;
  }
  think(dt){
    const inp=newInput();
    const me=this.me, foe=this.foe;
    // 攻撃/被弾中は入力しない
    if(['slash','special','hitstun','blockstun','down','ko','win'].includes(me.state)){
      this.swordT=0; return inp;
    }
    this.jumpCd-=dt;
    const dist=Math.abs(foe.body.position.x-me.body.position.x);
    const inRange=dist < me.def.reach+0.7;

    // ガード反応(相手の溜め/斬撃に対して たまに)
    if(this.guardT>0){ this.guardT-=dt; inp.guard=true; this.swordT=0; return inp; }
    if(me.state!=='charge'){
      if((foe.state==='charge' && dist<4 && Math.random()<0.03) ||
         (foe.state==='slash' && dist<3 && Math.random()<0.07) ||
         (foe.state==='special' && dist<4.5 && Math.random()<0.06)){
        this.guardT=rand(.3,.6); inp.guard=true; return inp;
      }
    }

    // 剣ホールド継続(短=通常斬り / 長=溜め必殺)
    if(this.swordT>0){ this.swordT-=dt; inp.swordHeld=true; return inp; }

    // まわり込み用ストレイフ
    this.strafeT-=dt;
    if(this.strafeT<=0){ this.strafeT=rand(.5,1.3);
      this.strafe=(Math.random()<.4?0:(Math.random()<.5?-1:1)); }

    this.decideT-=dt;
    if(this.decideT<=0){
      this.decideT=rand(.2,.45);
      const r=Math.random();
      if(inRange){
        if(r<.44){ this.swordT=rand(.10,.16); this.plan={}; }        // 通常斬り
        else if(r<.60){ this.swordT=rand(.62,.82); this.plan={}; }   // 溜め必殺(前もって溜める)
        else if(r<.72){ this.plan={moveX:-1}; }                      // 距離をとる
        else if(r<.82){ this.plan={moveX:0}; }
        else if(r<.92){ this.plan={sideZ:this.strafe||1}; }          // まわり込み
        else if(this.jumpCd<=0){ inp.jump=true; this.jumpCd=1.2; this.plan={}; }
      }else if(dist<4.6){
        if(r<.55) this.plan={moveX:1};
        else if(r<.72) this.plan={moveX:1,sideZ:this.strafe};
        else if(r<.86) this.plan={sideZ:this.strafe||1};
        else this.plan={moveX:1};
      }else{
        this.plan={moveX:1,sideZ:(Math.random()<.3?this.strafe:0)};
      }
    }
    const P=this.plan||{};
    inp.moveX=P.moveX||0;
    inp.sideZ=P.sideZ||0;
    if(!inp.sideZ && dist>1.5 && dist<4 && Math.random()<.02) inp.sideZ=this.strafe;
    return inp;
  }
}

/* ============================================================
   8. 演出(ヒットストップ・画面シェイク・アナウンス・HUD)
============================================================ */
let freezeT=0, shakeT=0, shakeAmp=0;
function hitstop(t){freezeT=Math.max(freezeT,t);}
function shake(t,amp){shakeT=Math.max(shakeT,t);shakeAmp=Math.max(shakeAmp,amp);}

const $=id=>document.getElementById(id);
function announce(text,dur=900,color){
  const el=$('annText');
  el.textContent=text;
  el.style.color=color||'';
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  clearTimeout(announce._t);
  announce._t=setTimeout(()=>el.classList.remove('show'),dur);
}
let comboTimers={};
function showCombo(f,n){
  if(n<2)return;
  const el=f.isPlayer?$('comboL'):$('comboR');
  el.textContent=n+' 連斬!';
  el.style.opacity=1;
  clearTimeout(comboTimers[f.isPlayer]);
  comboTimers[f.isPlayer]=setTimeout(()=>el.style.opacity=0,900);
}
function updateHUD(){
  if(!G.p1)return;
  const set=(f,hpId,hprId,cdId,cdwId)=>{
    const r=clamp(f.hp/f.maxHp,0,1)*100;
    $(hpId).style.width=r+'%'; $(hprId).style.width=r+'%';
    let c=0, ready=false;
    if(f.charging){ c=clamp(f.chargeT/CHARGE_MIN,0,1); ready=f.chargeT>=CHARGE_MIN; }
    $(cdId).style.width=(c*100)+'%';
    $(cdwId).classList.toggle('rdy',ready);
  };
  set(G.p1,'hp1','hpr1','cd1','cd1w');
  set(G.p2,'hp2','hpr2','cd2','cd2w');
  $('timer').textContent=Math.ceil(Math.max(0,G.timer));
  // プレイヤー側:剣ボタンの見た目(溜め/完了)
  const bS=$('bS');
  if(bS){
    bS.classList.toggle('charge',G.p1.charging);
    bS.classList.toggle('ready',G.p1.charging&&G.p1.chargeT>=CHARGE_MIN);
  }
}
function updatePips(){
  [['pips1',G.wins1],['pips2',G.wins2]].forEach(([id,w])=>{
    [...$(id).children].forEach((p,i)=>p.classList.toggle('won',i<w));
  });
}

/* ============================================================
   9. ゲームフロー
============================================================ */
const G={mode:'select',p1:null,p2:null,brain:null,
  wins1:0,wins2:0,round:1,timer:ROUND_TIME,phase:'',phaseT:0};

function pickCpuChar(playerDef){
  const others=CHARS.filter(c=>c!==playerDef);
  return others[Math.floor(Math.random()*others.length)];
}
function startMatch(playerDef){
  if(G.p1){scene.remove(G.p1.mesh);world.removeBody(G.p1.body);}
  if(G.p2){scene.remove(G.p2.mesh);world.removeBody(G.p2.body);}
  slashes.forEach(s=>scene.remove(s.m));slashes.length=0;
  const cpuDef=pickCpuChar(playerDef);
  G.p1=new Fighter(playerDef,true);
  G.p2=new Fighter(cpuDef,false);
  G.p1.opponent=G.p2; G.p2.opponent=G.p1;
  G.brain=new CpuBrain(G.p2,G.p1);
  G.wins1=0;G.wins2=0;G.round=1;
  $('name1').textContent=playerDef.name+'(あなた)';
  $('name2').textContent=cpuDef.name+'(CPU)';
  $('sp1').textContent='必殺:'+playerDef.sp.name;
  $('sp2').textContent='必殺:'+cpuDef.sp.name;
  $('select').classList.add('hidden');
  $('result').classList.add('hidden');
  $('hud').classList.remove('hidden');
  $('ctrl').classList.remove('hidden');
  updatePips();
  AudioEngine.startBGM();
  startRound();
}
function startRound(){
  G.p1.reset(-3.4); G.p2.reset(3.4);
  G.p1.setState('idle'); G.p2.setState('idle');
  G.timer=ROUND_TIME;
  G.mode='countdown'; G.phase='round'; G.phaseT=0;
  slashes.forEach(s=>scene.remove(s.m));slashes.length=0;
  announce('ROUND '+G.round,800);
  AudioEngine.sCount();
}
function endRound(winner){
  G.mode='roundend'; G.phaseT=0;
  if(winner===1){G.wins1++;G.p1.setState('win');}
  else if(winner===2){G.wins2++;G.p2.setState('win');}
  updatePips();
}
function showResult(){
  G.mode='result';
  AudioEngine.stopBGM();
  const win=G.wins1>=ROUNDS_TO_WIN;
  $('resTitle').textContent=win?'YOU WIN!':'YOU LOSE...';
  $('resTitle').className=win?'win':'lose';
  $('resSub').textContent=win
    ? G.p1.def.name+' の勝利! '+G.wins1+' - '+G.wins2
    : G.p2.def.name+'(CPU) の勝利… '+G.wins1+' - '+G.wins2+' / もう一度 挑戦しよう!';
  $('result').classList.remove('hidden');
  $('ctrl').classList.add('hidden');
  if(win)AudioEngine.sWin();else AudioEngine.sLose();
}
function updateFlow(dt){
  G.phaseT+=dt;
  if(G.mode==='countdown'){
    if(G.phase==='round'&&G.phaseT>1.0){G.phase='ready';G.phaseT=0;
      announce('READY…',800);AudioEngine.sCount();}
    else if(G.phase==='ready'&&G.phaseT>1.0){G.phase='fight';G.phaseT=0;
      announce('FIGHT!',700,'#ff4d5e');AudioEngine.sGo();G.mode='fight';}
  }
  else if(G.mode==='fight'){
    G.timer-=dt;
    if(G.p1.dead||G.p2.dead){
      announce('K.O.!',1200,'#ff4d5e');AudioEngine.sKO();shake(.5,.4);
      endRound(G.p1.dead?2:1);
    }else if(G.timer<=0){
      announce('TIME UP',1000);
      const r1=G.p1.hp/G.p1.maxHp, r2=G.p2.hp/G.p2.maxHp;
      endRound(r1===r2?0:(r1>r2?1:2));
    }
  }
  else if(G.mode==='roundend'){
    if(G.phaseT>2.0){
      if(G.wins1>=ROUNDS_TO_WIN||G.wins2>=ROUNDS_TO_WIN)showResult();
      else{G.round++;startRound();}
    }
  }
}

let selectedDef=null;
function buildSelect(){
  const grid=$('charGrid');
  CHARS.forEach(def=>{
    const card=document.createElement('div');
    card.className='card';
    const col='#'+def.color.toString(16).padStart(6,'0');
    const sab='#'+def.saber.toString(16).padStart(6,'0');
    card.innerHTML=
      '<div class="face" style="background:'+col+'">'+def.emoji+
        '<span class="blade" style="background:linear-gradient(#fff,'+sab+');box-shadow:0 0 10px '+sab+'"></span></div>'+
      '<div class="nm">'+def.name+'</div>'+
      '<div class="tp">'+def.type+'</div>'+
      '<div class="st">'+
        '<span>パワー</span><div class="stbar"><i style="width:'+def.stats.pow*100+'%"></i></div>'+
        '<span>スピード</span><div class="stbar"><i style="width:'+def.stats.spd*100+'%"></i></div>'+
        '<span>リーチ</span><div class="stbar"><i style="width:'+def.stats.rch*100+'%"></i></div>'+
      '</div>'+
      '<div class="ds">'+def.desc+'</div>'+
      '<div class="spn">必殺: '+def.sp.name+'</div>';
    card.addEventListener('pointerdown',()=>{
      AudioEngine.init();AudioEngine.resume();AudioEngine.sSelect();
      document.querySelectorAll('.card').forEach(c=>c.classList.remove('sel'));
      card.classList.add('sel');
      selectedDef=def;
      $('btnStart').disabled=false;
    });
    grid.appendChild(card);
  });
  $('btnStart').addEventListener('pointerdown',()=>{
    if(!selectedDef)return;
    AudioEngine.init();AudioEngine.resume();AudioEngine.sGo();
    startMatch(selectedDef);
  });
  $('btnRematch').addEventListener('pointerdown',()=>{
    AudioEngine.resume();startMatch(G.p1.def);
  });
  $('btnSelect').addEventListener('pointerdown',()=>{
    $('result').classList.add('hidden');
    $('hud').classList.add('hidden');
    $('ctrl').classList.add('hidden');
    $('select').classList.remove('hidden');
    G.mode='select';
  });
}
buildSelect();

/* ============================================================
   11. メインループ(120Hz対応: delta-time正規化)
============================================================ */
const clock=new THREE.Clock();
const FIXED=1/60;
function resize(){
  renderer.setSize(innerWidth,innerHeight);
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize',resize); resize();

function loop(){
  requestAnimationFrame(loop);
  let dt=Math.min(clock.getDelta(),.05);
  if(freezeT>0){freezeT-=dt;dt=0;}

  if(G.mode!=='select'&&G.p1){
    if(dt>0){
      updateFlow(dt);
      const controllable=G.mode==='fight';
      const inp1=controllable?Pad.read(G.p1.face):newInput();
      const inp2=(controllable&&G.brain)?G.brain.think(dt):newInput();
      G.p1.update(dt,inp1);
      G.p2.update(dt,inp2);
      world.step(FIXED,dt,4);
      // キャラ同士の押し合い(すり抜け防止)
      const a=G.p1.body,b2=G.p2.body;
      const dx=b2.position.x-a.position.x, dz=b2.position.z-a.position.z;
      const minD=(G.p1.def.width+G.p2.def.width)*.34;
      const dd=Math.hypot(dx,dz);
      if(dd<minD&&dd>.001){
        const push=(minD-dd)/2, nx=dx/dd, nz=dz/dd;
        a.position.x-=nx*push; a.position.z-=nz*push;
        b2.position.x+=nx*push; b2.position.z+=nz*push;
      }
      G.p1.syncMesh(dt); G.p2.syncMesh(dt);
      updateSlashes(dt);
      updateParticles(dt);
      updateHUD();
    }
    // カメラ: 2人の中間を追従
    const p1=G.p1.mesh.position, p2=G.p2.mesh.position;
    const midX=(p1.x+p2.x)/2, midZ=(p1.z+p2.z)/2;
    const sep=Math.hypot(p1.x-p2.x,p1.z-p2.z);
    const dist=clamp(sep*.85+4.4,6.5,11.5);
    const ty=2.7+sep*.08;
    camera.position.x=lerp(camera.position.x,midX,.08);
    camera.position.y=lerp(camera.position.y,ty,.06);
    camera.position.z=lerp(camera.position.z,midZ+dist,.07);
    let lx=midX,ly=1.2,lz=midZ;
    if(shakeT>0){shakeT-=Math.max(dt,.008);
      const amp=shakeAmp*(shakeT>0?shakeT:0)*3;
      lx+=rand(-amp,amp);ly+=rand(-amp,amp);
      if(shakeT<=0)shakeAmp=0;}
    camera.lookAt(lx,ly,lz);
  }else{
    const t=performance.now()/4000;
    camera.position.set(Math.sin(t)*9,3.5,Math.cos(t)*9);
    camera.lookAt(0,1,0);
    if(dt>0){updateParticles(dt);updateSlashes(dt);}
  }
  renderer.render(scene,camera);
}
loop();

// テスト用フック(本番動作には影響しない)
window.__F = { G, CHARS, Pad, AudioEngine };
